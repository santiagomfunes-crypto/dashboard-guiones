<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Guiones — Santiago Funes RE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <script src="supabase.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Montserrat',sans-serif;background:#F5F5F3;color:#1a1a2e;min-height:100vh}
        button{cursor:pointer;font-family:inherit}
        input,textarea,select{font-family:inherit}

        /* Login */
        #login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
        .login-box{background:#fff;border:1px solid #E8E4DD;border-radius:16px;padding:48px 36px;max-width:400px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.06)}
        .login-box h1{font-family:'Cinzel',serif;font-size:22px;letter-spacing:2px;text-align:center;margin-bottom:4px}
        .login-sub{text-align:center;color:#8B6F3A;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:32px}
        .login-box label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#999;margin-bottom:6px;font-weight:600}
        .login-box input{width:100%;padding:12px 16px;border:1px solid #E8E4DD;border-radius:10px;font-size:14px;background:#F5F5F3;outline:none;margin-bottom:20px}
        .login-box input:focus{border-color:#8B6F3A;background:#fff}
        .login-btn{width:100%;padding:14px;background:#1a1a2e;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
        .login-btn:disabled{opacity:0.5}
        .login-error{color:#C8453A;font-size:12px;text-align:center;margin-top:12px;min-height:18px}

        /* App */
        #app{display:none;padding:20px;max-width:1200px;margin:0 auto}
        .header{text-align:center;padding:20px 0 16px;border-bottom:2px solid #E8E4DD;margin-bottom:20px}
        .header h1{font-family:'Cinzel',serif;font-size:22px;letter-spacing:3px}
        .header-sub{color:#8B6F3A;font-size:11px;letter-spacing:4px;text-transform:uppercase}

        /* Stats */
        .stats{display:flex;gap:12px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
        .stat{background:#fff;border:1px solid #E8E4DD;border-radius:10px;padding:12px 22px;text-align:center;box-shadow:0 1px 3px #0001}
        .stat .n{font-family:'Cinzel',serif;font-size:22px;color:#8B6F3A}
        .stat .l{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#999;margin-top:2px}

        /* Actions */
        .actions{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
        .btn-gold{background:#8B6F3A;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-weight:700;font-size:11px;letter-spacing:1px}
        .btn-gold:hover{opacity:0.85}
        .btn-outline{background:#fff;color:#8B6F3A;border:1px solid #8B6F3A;padding:9px 20px;border-radius:8px;font-weight:600;font-size:11px;letter-spacing:1px}
        .btn-outline:hover{background:#8B6F3A11}
        .btn-danger{background:#fff;color:#C8453A;border:1px solid #C8453A44;padding:9px 20px;border-radius:8px;font-weight:600;font-size:11px}

        /* Filters */
        .filters{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
        .fbtn{background:#fff;border:1px solid #E8E4DD;color:#999;padding:6px 14px;border-radius:20px;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:600}
        .fbtn:hover,.fbtn.on{background:#8B6F3A;color:#fff;border-color:#8B6F3A}
        .cbtn{background:#fff;border:1px solid #E8E4DD;color:#777;padding:5px 12px;border-radius:6px;font-size:9px;letter-spacing:0.5px;font-weight:500}
        .cbtn:hover,.cbtn.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
        .tbtn{background:#fff;border:1px solid #E8E4DD;color:#777;padding:8px 20px;border-radius:8px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
        .tbtn:hover,.tbtn.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}

        /* Search */
        .search{display:flex;justify-content:center;margin-bottom:16px}
        .search input{width:100%;max-width:440px;padding:10px 16px;border:1px solid #E8E4DD;border-radius:8px;font-size:13px;background:#fff;outline:none}
        .search input:focus{border-color:#8B6F3A}
        .count{text-align:center;font-size:11px;color:#bbb;margin-bottom:16px}

        /* Grid */
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:16px}
        .card{background:#fff;border:1px solid #E8E4DD;border-radius:10px;padding:16px;cursor:pointer;transition:all 0.2s;box-shadow:0 1px 3px #0001}
        .card:hover{border-color:#8B6F3A66;box-shadow:0 2px 8px #0002}
        .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
        .card-id{font-family:'Cinzel',serif;font-size:14px;color:#8B6F3A}
        .badge{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border-radius:6px;font-weight:600;display:inline-block}
        .card-title{font-weight:600;font-size:13px;margin-bottom:4px}
        .card-hook{font-size:11px;color:#777;line-height:1.5;font-style:italic}
        .card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
        .st-listo{background:#F5F5F3;color:#999;font-size:9px;padding:3px 8px;border-radius:4px}
        .st-filmado{background:#E8F5EE;color:#2D8C5A;font-size:9px;padding:3px 8px;border-radius:4px}
        .st-publicado{background:#E8F0FD;color:#4A90D9;font-size:9px;padding:3px 8px;border-radius:4px}
        .st-descartado{background:#FDE8E8;color:#C8453A;font-size:9px;padding:3px 8px;border-radius:4px}
        .card-sem{font-size:9px;color:#bbb}

        /* Modal */
        .modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100;overflow-y:auto;justify-content:center;padding:40px 20px}
        .modal-bg.open{display:flex}
        .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:28px;position:relative;height:fit-content}
        .modal-x{position:absolute;top:14px;right:18px;background:none;border:none;color:#ccc;font-size:24px}
        .modal-x:hover{color:#333}
        .fg{margin-bottom:16px}
        .fg label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8B6F3A;margin-bottom:4px;font-weight:600}
        .fg input,.fg textarea,.fg select{width:100%;padding:10px 12px;border:1px solid #E8E4DD;border-radius:8px;font-size:13px;background:#F5F5F3;outline:none;resize:vertical}
        .fg input:focus,.fg textarea:focus,.fg select:focus{border-color:#8B6F3A;background:#fff}
        .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .stars span{font-size:22px;cursor:pointer;color:#ddd}
        .stars span.on{color:#8B6F3A}
        .modal-actions{display:flex;gap:10px;margin-top:16px}
        .save-btn{background:#8B6F3A;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:700;font-size:12px;letter-spacing:1px}
        .save-btn:disabled{opacity:0.5}
        .discard-btn{background:#fff;color:#C8453A;border:1px solid #C8453A44;padding:12px 24px;border-radius:8px;font-weight:600;font-size:12px}
        .modal-msg{font-size:12px;margin-top:8px;min-height:18px}

        /* Toast */
        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none}
        .toast.show{opacity:1}
        .toast.err{background:#C8453A}

        /* Responsive */
        @media(max-width:640px){.grid{grid-template-columns:1fr}.frow{grid-template-columns:1fr}.modal{padding:18px}}
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
    <div class="login-box">
        <h1>Santiago Funes</h1>
        <div class="login-sub">Dashboard de Guiones</div>
        <form id="login-form">
            <label>Email</label>
            <input type="email" id="in-email" placeholder="tu@email.com" required>
            <label>Contrasena</label>
            <input type="password" id="in-pass" required>
            <button type="submit" class="login-btn" id="login-btn">Ingresar</button>
        </form>
        <div class="login-error" id="login-err"></div>
    </div>
</div>

<!-- APP -->
<div id="app">
    <div class="header">
        <h1>Santiago Funes</h1>
        <div class="header-sub">Dashboard de Guiones</div>
    </div>

    <div class="stats">
        <div class="stat"><div class="n" id="s-tot">-</div><div class="l">Total</div></div>
        <div class="stat"><div class="n" id="s-lis">-</div><div class="l">Listos</div></div>
        <div class="stat"><div class="n" id="s-fil">-</div><div class="l">Filmados</div></div>
        <div class="stat"><div class="n" id="s-pub">-</div><div class="l">Publicados</div></div>
    </div>

    <div class="actions">
        <button class="btn-outline" onclick="openIdeas()">Proponer Idea</button>
        <button class="btn-danger" onclick="doSignOut()">Cerrar sesion</button>
    </div>

    <div class="filters" id="f-tipo"></div>
    <div class="filters" id="f-ang"></div>
    <div class="filters" id="f-cat"></div>

    <div class="search"><input type="text" id="q" placeholder="Buscar guion..."></div>
    <div class="count" id="cnt"></div>

    <div class="grid" id="grid"></div>
</div>

<!-- MODAL GUION -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <button class="modal-x" onclick="closeModal()">&times;</button>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
            <span id="m-id" style="font-family:'Cinzel',serif;font-size:18px;color:#8B6F3A"></span>
            <span class="badge" id="m-badge"></span>
        </div>
        <div class="fg"><label>Titulo</label><input id="m-tit"></div>
        <div class="fg"><label>Hook</label><textarea id="m-hook" rows="2"></textarea></div>
        <div class="fg"><label>Texto completo</label><textarea id="m-txt" rows="10" style="min-height:200px"></textarea></div>
        <div class="fg"><label>Textos en pantalla</label><textarea id="m-scr" rows="2"></textarea></div>
        <div class="fg"><label>Caption IG</label><textarea id="m-ig" rows="2"></textarea></div>
        <div class="fg"><label>Caption TikTok</label><textarea id="m-tk" rows="2"></textarea></div>
        <div class="fg"><label>Fuentes</label><textarea id="m-fue" rows="2"></textarea></div>
        <div class="frow">
            <div class="fg"><label>Angulo</label><select id="m-ang"></select></div>
            <div class="fg"><label>Status</label>
                <select id="m-st">
                    <option value="listo">Listo</option>
                    <option value="filmado">Filmado</option>
                    <option value="publicado">Publicado</option>
                    <option value="descartado">Descartado</option>
                </select>
            </div>
        </div>
        <div class="frow">
            <div class="fg"><label>Semana</label><input id="m-sem" placeholder="Ej: Sem 1, Lunes 21/4"></div>
            <div class="fg"><label>Rating</label><div class="stars" id="m-stars"></div></div>
        </div>
        <div class="fg"><label>Notas / Feedback</label><textarea id="m-not" rows="3" placeholder="Notas internas..."></textarea></div>
        <div class="modal-actions">
            <button class="save-btn" id="m-save" onclick="doSave()">Guardar</button>
            <button class="discard-btn" onclick="doDiscard()">Descartar</button>
        </div>
        <div class="modal-msg" id="m-msg"></div>
    </div>
</div>

<!-- MODAL IDEAS -->
<div class="modal-bg" id="ideas-modal" onclick="if(event.target===this)closeIdeas()">
    <div class="modal">
        <button class="modal-x" onclick="closeIdeas()">&times;</button>
        <div style="font-family:'Cinzel',serif;font-size:18px;color:#8B6F3A;margin-bottom:20px">Proponer Idea</div>
        <div class="fg"><label>Autor</label><input id="i-aut" placeholder="Tu nombre" value="Santiago"></div>
        <div class="frow">
            <div class="fg"><label>Angulo</label><select id="i-ang"></select></div>
            <div class="fg"><label>Categoria</label><select id="i-cat"></select></div>
        </div>
        <div class="fg"><label>Tema</label><input id="i-tema" placeholder="De que se trata?"></div>
        <div class="fg"><label>Detalle</label><textarea id="i-det" rows="4" placeholder="Describilo..."></textarea></div>
        <button class="save-btn" style="width:100%" onclick="doSaveIdea()">Enviar Idea</button>
        <div class="modal-msg" id="i-msg"></div>
        <div id="ideas-list" style="margin-top:20px"></div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// Config
var SB_URL = 'https://pgnmpxqljxrpnvexcygh.supabase.co';
var SB_KEY = 'sb_publishable_HmiBL9VpEhaYyPqjA1v67w_F38x48El';

var ANG = {prob:'Problema',prod:'Producto',sol:'Solucion',con:'Otro',aut:'Autoridad',pred:'Prediccion',comp:'Comparacion',hist:'Historia'};
var ANG_C = {prob:['#FDE8E8','#C8453A'],prod:['#E8F5EE','#2D8C5A'],sol:['#E8F0FD','#4A90D9'],con:['#FDF3E8','#D48A2C'],aut:['#F5E8FD','#7B4A9E'],pred:['#E8FDF8','#1F8F7A'],comp:['#FDF8E8','#A8862C'],hist:['#FDE8F0','#B4455F']};
var TEMAS = {'Inversion':'Inversion','Credito':'Credito','Costos':'Costos','Fideicomiso':'Fideicomiso','Tandil':'Tandil','Alquileres':'Alquileres','Mercado':'Mercado','PrimerDepto':'1er Depto','Mudarse':'Mudarse','Infra':'Infra','Escena':'Escena','Polemicos':'Polemicos','Meta':'Meta Ads','Captacion':'Captacion'};

var sb, allG=[], curId=null, curRat=0;
var fTipo='organico', fAng='todos', fCat='todos', fQ='';

// Init
var sb = window.supabase.createClient(SB_URL, SB_KEY);

// Build selects
var angSel = document.getElementById('m-ang');
var iAngSel = document.getElementById('i-ang');
var iCatSel = document.getElementById('i-cat');
iAngSel.innerHTML = '<option value="">-- Angulo --</option>';
iCatSel.innerHTML = '<option value="">-- Categoria --</option>';
for (var k in ANG) {
    angSel.innerHTML += '<option value="'+k+'">'+ANG[k]+'</option>';
    iAngSel.innerHTML += '<option value="'+k+'">'+ANG[k]+'</option>';
}
for (var k in TEMAS) {
    iCatSel.innerHTML += '<option value="'+k+'">'+TEMAS[k]+'</option>';
}

// Build filters
var fTipoEl = document.getElementById('f-tipo');
[['organico','Organico'],['ads','Meta Ads'],['todos','Todos']].forEach(function(x){
    var b = document.createElement('button');
    b.className = 'tbtn' + (x[0]===fTipo?' on':'');
    b.textContent = x[1];
    b.onclick = function(){ fTipo=x[0]; updBtns(fTipoEl,'tbtn',b); doFilter(); };
    fTipoEl.appendChild(b);
});

var fAngEl = document.getElementById('f-ang');
var allBtn = document.createElement('button');
allBtn.className='fbtn on'; allBtn.textContent='Todos';
allBtn.onclick=function(){ fAng='todos'; updBtns(fAngEl,'fbtn',allBtn); doFilter(); };
fAngEl.appendChild(allBtn);
for (var k in ANG) {
    (function(key){
        var b = document.createElement('button');
        b.className='fbtn'; b.textContent=ANG[key];
        b.onclick=function(){ fAng=key; updBtns(fAngEl,'fbtn',b); doFilter(); };
        fAngEl.appendChild(b);
    })(k);
}

var fCatEl = document.getElementById('f-cat');
var allC = document.createElement('button');
allC.className='cbtn on'; allC.textContent='Todos';
allC.onclick=function(){ fCat='todos'; updBtns(fCatEl,'cbtn',allC); doFilter(); };
fCatEl.appendChild(allC);
for (var k in TEMAS) {
    (function(key){
        var b = document.createElement('button');
        b.className='cbtn'; b.textContent=TEMAS[key];
        b.onclick=function(){ fCat=key; updBtns(fCatEl,'cbtn',b); doFilter(); };
        fCatEl.appendChild(b);
    })(k);
}

function updBtns(wrap,cls,active){
    wrap.querySelectorAll('.'+cls).forEach(function(b){b.classList.remove('on');});
    active.classList.add('on');
}

// Search
var sTO;
document.getElementById('q').addEventListener('input', function(e){
    clearTimeout(sTO);
    sTO = setTimeout(function(){ fQ=e.target.value.trim().toLowerCase(); doFilter(); }, 200);
});

// Login
document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('in-email').value.trim();
    var pass = document.getElementById('in-pass').value;
    var btn = document.getElementById('login-btn');
    var err = document.getElementById('login-err');
    btn.disabled=true; btn.textContent='Ingresando...'; err.textContent='';
    sb.auth.signInWithPassword({email:email,password:pass}).then(function(res){
        if(res.error) throw res.error;
        enterApp();
    }).catch(function(ex){
        err.textContent = ex.message==='Invalid login credentials'?'Email o contrasena incorrectos.':(ex.message||'Error');
    }).finally(function(){
        btn.disabled=false; btn.textContent='Ingresar';
    });
});

function doSignOut(){
    sb.auth.signOut().then(function(){
        document.getElementById('app').style.display='none';
        document.getElementById('login').style.display='flex';
        allG=[];
    });
}

function enterApp(){
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    loadAll();
    // Realtime
    try {
        sb.channel('g').on('postgres_changes',{event:'*',schema:'public',table:'guiones'},function(){loadAll();}).subscribe();
    } catch(e){}
}

function loadAll(){
    sb.from('guiones').select('*').order('id').then(function(res){
        if(res.error){toast('Error: '+res.error.message,true);return;}
        allG=res.data||[];
        doFilter();
        loadStats();
    });
}

function loadStats(){
    var t=allG.length, l=0, f=0, p=0;
    allG.forEach(function(g){
        var s=g.status||'listo';
        if(s==='filmado')f++; else if(s==='publicado')p++; else l++;
    });
    document.getElementById('s-tot').textContent=t;
    document.getElementById('s-lis').textContent=l;
    document.getElementById('s-fil').textContent=f;
    document.getElementById('s-pub').textContent=p;
}

function doFilter(){
    var r = allG.filter(function(g){
        var tp = (g.tipo||'organico').toLowerCase();
        if(fTipo!=='todos' && ((fTipo==='organico'&&tp!=='organico')||(fTipo==='ads'&&tp!=='ads'))) return false;
        if(fAng!=='todos' && (g.angulo||'')!==fAng) return false;
        if(fCat!=='todos' && (g.tema||'')!==fCat) return false;
        if(fQ){
            var hay = [g.id,g.titulo,g.hook,g.texto,g.tema].filter(Boolean).join(' ').toLowerCase();
            if(hay.indexOf(fQ)<0) return false;
        }
        return true;
    });
    document.getElementById('cnt').textContent = r.length+' de '+allG.length+' guiones';
    renderGrid(r);
}

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

function renderGrid(gs){
    var el = document.getElementById('grid');
    if(!gs.length){el.innerHTML='<div style="text-align:center;padding:40px;color:#ccc">No hay guiones con estos filtros.</div>';return;}
    el.innerHTML = gs.map(function(g){
        var a=(g.angulo||'').toLowerCase();
        var c=ANG_C[a]||['#F0EFED','#999'];
        var st=g.status||'listo';
        var hk=(g.hook||''); if(hk.length>100)hk=hk.substring(0,100)+'...';
        return '<div class="card" onclick="openModal(\''+esc(g.id)+'\')">' +
            '<div class="card-top"><span class="card-id">'+esc(g.id)+'</span>' +
            '<span class="badge" style="background:'+c[0]+';color:'+c[1]+'">'+esc(ANG[a]||a)+'</span></div>' +
            '<div class="card-title">'+esc(g.titulo)+'</div>' +
            '<div class="card-hook">'+esc(hk)+'</div>' +
            '<div class="card-bottom"><span class="st-'+st+'">'+(st.charAt(0).toUpperCase()+st.slice(1))+'</span>' +
            '<span class="card-sem">'+esc(g.semana||'')+'</span></div></div>';
    }).join('');
}

// Modal
function openModal(id){
    var g=allG.find(function(x){return x.id===id;});
    if(!g)return;
    curId=id;
    document.getElementById('m-id').textContent=g.id;
    var a=(g.angulo||'').toLowerCase();
    var c=ANG_C[a]||['#F0EFED','#999'];
    var badge=document.getElementById('m-badge');
    badge.textContent=ANG[a]||a; badge.style.background=c[0]; badge.style.color=c[1];
    document.getElementById('m-tit').value=g.titulo||'';
    document.getElementById('m-hook').value=g.hook||'';
    document.getElementById('m-txt').value=g.texto||'';
    document.getElementById('m-scr').value=g.screen||'';
    document.getElementById('m-ig').value=g.caption_ig||'';
    document.getElementById('m-tk').value=g.caption_tk||'';
    document.getElementById('m-fue').value=g.fuentes||'';
    document.getElementById('m-ang').value=a;
    document.getElementById('m-st').value=g.status||'listo';
    document.getElementById('m-sem').value=g.semana||'';
    document.getElementById('m-not').value=g.notas||'';
    document.getElementById('m-msg').textContent='';
    curRat=g.rating||0; renderStars();
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow='hidden';
}

function closeModal(){
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow='';
    curId=null;
}

function renderStars(){
    var el=document.getElementById('m-stars'); el.innerHTML='';
    for(var i=1;i<=5;i++){
        (function(n){
            var s=document.createElement('span');
            s.innerHTML='&#9733;';
            s.className=n<=curRat?'on':'';
            s.onclick=function(){curRat=n;renderStars();};
            el.appendChild(s);
        })(i);
    }
}

function doSave(){
    if(!curId)return;
    var btn=document.getElementById('m-save');
    var msg=document.getElementById('m-msg');
    btn.disabled=true; btn.textContent='Guardando...'; msg.textContent='';
    var u={
        titulo:document.getElementById('m-tit').value,
        hook:document.getElementById('m-hook').value,
        texto:document.getElementById('m-txt').value,
        screen:document.getElementById('m-scr').value,
        caption_ig:document.getElementById('m-ig').value,
        caption_tk:document.getElementById('m-tk').value,
        fuentes:document.getElementById('m-fue').value,
        angulo:document.getElementById('m-ang').value,
        status:document.getElementById('m-st').value,
        semana:document.getElementById('m-sem').value,
        rating:curRat,
        notas:document.getElementById('m-not').value,
        updated_at:new Date().toISOString()
    };
    sb.from('guiones').update(u).eq('id',curId).then(function(res){
        if(res.error) throw res.error;
        var idx=allG.findIndex(function(x){return x.id===curId;});
        if(idx>=0) for(var k in u) allG[idx][k]=u[k];
        doFilter(); loadStats();
        msg.style.color='#2D8C5A'; msg.textContent='Guardado';
        toast('Guion guardado');
        setTimeout(function(){msg.textContent='';},3000);
    }).catch(function(err){
        msg.style.color='#C8453A'; msg.textContent='Error: '+err.message;
        toast('Error al guardar',true);
    }).finally(function(){
        btn.disabled=false; btn.textContent='Guardar';
    });
}

function doDiscard(){
    if(!curId||!confirm('Marcar como descartado?'))return;
    sb.from('guiones').update({status:'descartado',updated_at:new Date().toISOString()}).eq('id',curId).then(function(res){
        if(res.error){toast('Error: '+res.error.message,true);return;}
        var idx=allG.findIndex(function(x){return x.id===curId;});
        if(idx>=0) allG[idx].status='descartado';
        document.getElementById('m-st').value='descartado';
        doFilter(); loadStats();
        toast('Guion descartado');
    });
}

// Ideas
function openIdeas(){
    document.getElementById('ideas-modal').classList.add('open');
    document.body.style.overflow='hidden';
    loadIdeas();
}
function closeIdeas(){
    document.getElementById('ideas-modal').classList.remove('open');
    document.body.style.overflow='';
}
function loadIdeas(){
    sb.from('ideas').select('*').order('created_at',{ascending:false}).then(function(res){
        var el=document.getElementById('ideas-list');
        var ideas=(res.data||[]);
        if(!ideas.length){el.innerHTML='<p style="color:#ccc;font-size:12px;text-align:center;padding:12px">No hay ideas todavia.</p>';return;}
        el.innerHTML='<div style="font-weight:600;font-size:12px;color:#8B6F3A;margin-bottom:8px">Ideas ('+ideas.length+')</div>'+
            ideas.map(function(i){
                return '<div style="background:#F5F5F3;border-radius:8px;padding:10px;margin-bottom:6px;font-size:12px">'+
                    '<strong>'+esc(i.tema)+'</strong> <span style="color:#999">— '+esc(i.autor||'')+'</span>'+
                    (i.detalle?'<div style="color:#777;margin-top:4px">'+esc(i.detalle)+'</div>':'')+
                    '</div>';
            }).join('');
    });
}
function doSaveIdea(){
    var tema=document.getElementById('i-tema').value.trim();
    var msg=document.getElementById('i-msg');
    if(!tema){msg.style.color='#C8453A';msg.textContent='Completa el tema.';return;}
    msg.textContent='';
    sb.from('ideas').insert({
        autor:document.getElementById('i-aut').value.trim()||'Anonimo',
        angulo:document.getElementById('i-ang').value,
        tema:tema,
        detalle:document.getElementById('i-det').value.trim(),
        estado:'propuesta'
    }).then(function(res){
        if(res.error){msg.style.color='#C8453A';msg.textContent='Error: '+res.error.message;return;}
        document.getElementById('i-tema').value='';
        document.getElementById('i-det').value='';
        msg.style.color='#2D8C5A'; msg.textContent='Idea enviada!';
        toast('Idea enviada');
        setTimeout(function(){msg.textContent='';},3000);
        loadIdeas();
    });
}

// Toast
var toastTO;
function toast(msg,err){
    var el=document.getElementById('toast');
    el.textContent=msg;
    el.className='toast show'+(err?' err':'');
    clearTimeout(toastTO);
    toastTO=setTimeout(function(){el.className='toast';},2500);
}

// Keyboard
document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
        if(document.getElementById('modal').classList.contains('open'))closeModal();
        if(document.getElementById('ideas-modal').classList.contains('open'))closeIdeas();
    }
});

// Auto-login check
sb.auth.getSession().then(function(res){
    if(res.data && res.data.session) enterApp();
}).catch(function(){});
</script>
