.notice { background: #1a2e1a; border: 1px solid #2d5a2d; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; color: #86efac; }

let selected = new Set();

function render(images) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  images.forEach((img, i) => {
    const name = img.url.split('/').pop();
    const card = document.createElement('div');
    card.className = 'card' + (selected.has(img.url) ? ' selected' : '');
    card.dataset.url = img.url;
    card.dataset.kb = img.kb;
    card.innerHTML = `
      <img src="${img.url}" loading="lazy" onerror="this.style.opacity=0.1">
      <div class="info"><span>${name} · ${img.kb}KB</span></div>
      <div class="checkmark">✓</div>
    `;
    card.addEventListener('click', () => toggle(img.url, card));
    grid.appendChild(card);
  });
}

function toggle(url, card) {
  if (selected.has(url)) { selected.delete(url); card.classList.remove('selected'); }
  else { selected.add(url); card.classList.add('selected'); }
  document.getElementById('count').textContent = selected.size + ' seleccionadas';
}

function selectAll() {
  document.querySelectorAll('.card').forEach(c => { selected.add(c.dataset.url); c.classList.add('selected'); });
  document.getElementById('count').textContent = selected.size + ' seleccionadas';
}

function selectNone() {
  selected.clear();
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  document.getElementById('count').textContent = '0 seleccionadas';
}

function filterAll(el) {
  document.querySelectorAll('.filter').forEach(f => f.classList.remove('active'));
  el.classList.add('active');
  render(IMAGES);
}

function filterSize(el, minKB) {
  document.querySelectorAll('.filter').forEach(f => f.classList.remove('active'));
  el.classList.add('active');
  render(IMAGES.filter(i => i.kb >= minKB));
}

function copySelected() {
  const urls = [...selected];
  const text = JSON.stringify(urls, null, 2);
  navigator.clipboard.writeText(text).then(() => {
    const out = document.getElementById('output');
    out.style.display = 'block';
    out.textContent = `// ${urls.length} URLs copiadas al portapapeles\n` + text;
  });
}
