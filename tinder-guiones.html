<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinder Guiones — SFRE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F5F5F3;--card:#fff;--border:#E8E4DD;
  --gold:#8B6F3A;--gold-lt:#D4A853;--text:#1a1a2e;--muted:#777;--dim:#bbb;
  --green:#2D8C5A;--red:#C8453A;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;font-size:16px;min-height:100vh;display:flex;flex-direction:column;align-items:center;}

/* Header */
.hdr{width:100%;max-width:700px;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;}
.hdr-title{font-family:'Cinzel',serif;font-size:15px;font-weight:600;letter-spacing:2px;color:var(--gold);}
.progress-wrap{display:flex;align-items:center;gap:10px;}
.progress-bar{width:120px;height:4px;background:var(--border);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--gold);border-radius:4px;transition:width .3s;}
.progress-txt{font-size:12px;font-weight:700;color:var(--muted);}

/* Criteria strip */
.criteria{width:100%;max-width:700px;padding:0 24px 16px;display:flex;gap:8px;flex-wrap:wrap;}
.crit{font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;letter-spacing:.3px;}
.crit.bad{background:#FDE8E8;color:var(--red);}
.crit.good{background:#E8F5EE;color:var(--green);}

/* Stage */
.stage{position:relative;width:100%;max-width:660px;padding:0 24px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;}

/* Card */
.card-wrap{position:relative;width:100%;perspective:1000px;}
.g-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 4px 24px #0001;width:100%;transition:transform .25s,opacity .25s;user-select:none;}
.g-card.fly-left{transform:translateX(-120%) rotate(-12deg);opacity:0;}
.g-card.fly-right{transform:translateX(120%) rotate(12deg);opacity:0;}

.card-ang{font-size:10px;font-weight:700;padding:3px 10px;border-radius:6px;letter-spacing:.8px;text-transform:uppercase;display:inline-block;margin-bottom:12px;}
.card-titulo{font-size:20px;font-weight:800;line-height:1.3;margin-bottom:14px;}
.card-divider{height:1px;background:var(--border);margin:14px 0;}
.card-label{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;}
.card-hook{font-size:14px;font-weight:600;color:var(--gold);line-height:1.55;margin-bottom:12px;}
.card-cuerpo{font-size:13px;color:var(--muted);line-height:1.65;max-height:160px;overflow:hidden;position:relative;}
.card-cuerpo::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,#fff);}

/* Checklist overlay */
.checklist{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
.check-item{display:flex;align-items:center;gap:8px;cursor:pointer;}
.check-box{width:18px;height:18px;border:2px solid var(--border);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.check-box.checked{background:var(--gold);border-color:var(--gold);}
.check-box.checked::after{content:'✓';color:#fff;font-size:11px;font-weight:700;}
.check-label{font-size:12px;color:var(--muted);}

/* Verdict overlay */
.verdict-overlay{position:absolute;top:20px;right:20px;font-size:28px;font-weight:800;letter-spacing:2px;opacity:0;transition:opacity .1s;pointer-events:none;border:3px solid;padding:4px 12px;border-radius:8px;transform:rotate(15deg);}
.verdict-overlay.queda{color:var(--green);border-color:var(--green);}
.verdict-overlay.no{color:var(--red);border-color:var(--red);transform:rotate(-15deg);}

/* Buttons */
.btn-row{display:flex;gap:20px;margin-top:24px;justify-content:center;}
.btn-action{width:72px;height:72px;border-radius:50%;border:2px solid var(--border);background:#fff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px #0002;transition:all .15s;}
.btn-action:hover{transform:scale(1.12);}
.btn-no{border-color:#fbb;}
.btn-no:hover{background:#FDE8E8;border-color:var(--red);box-shadow:0 4px 20px #C8453A30;}
.btn-yes{border-color:#b5e8cc;}
.btn-yes:hover{background:#E8F5EE;border-color:var(--green);box-shadow:0 4px 20px #2D8C5A30;}
.btn-skip{width:44px;height:44px;font-size:18px;}

/* Keyboard hint */
.key-hint{display:flex;gap:16px;margin-top:12px;justify-content:center;}
.key{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:4px;}
.key kbd{background:#F0EDE8;border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:monospace;font-size:10px;color:var(--muted);}

/* Done screen */
.done{display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:60vh;text-align:center;padding:24px;}
.done.show{display:flex;}
.done-title{font-family:'Cinzel',serif;font-size:22px;color:var(--gold);letter-spacing:2px;}
.done-stats{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;}
.done-stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 24px;text-align:center;}
.done-stat-num{font-size:32px;font-weight:800;}
.done-stat-lbl{font-size:11px;color:var(--muted);margin-top:4px;}
.done-stat.yes .done-stat-num{color:var(--green);}
.done-stat.no .done-stat-num{color:var(--red);}
.btn-restart{margin-top:8px;padding:12px 28px;background:var(--gold);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.5px;}

/* Empty / loading */
.empty-state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 24px;color:var(--muted);font-size:14px;}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Status dot */
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);}
.dot.ok{background:#4CAF50;}
</style>
</head>
<body>

<div class="hdr">
  <span class="hdr-title">TINDER GUIONES</span>
  <div class="progress-wrap">
    <div class="dot" id="sb-dot"></div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <span class="progress-txt" id="prog-txt">—</span>
  </div>
</div>

<div class="criteria">
  <span class="crit bad">❌ Datos crudos / números</span>
  <span class="crit bad">❌ Vender en todos</span>
  <span class="crit good">✅ Habla de Tandil</span>
  <span class="crit good">✅ Hook que engancha en 2s</span>
  <span class="crit good">✅ Da valor, no vende</span>
</div>

<div class="stage" id="stage">
  <div class="empty-state" id="loader"><div class="spinner"></div><span>Cargando guiones…</span></div>

  <div class="card-wrap" id="card-wrap" style="display:none;">
    <div class="g-card" id="main-card">
      <div class="verdict-overlay queda" id="verd-yes">QUEDA</div>
      <div class="verdict-overlay no" id="verd-no">NO</div>

      <span class="card-ang" id="c-ang"></span>
      <div class="card-titulo" id="c-titulo"></div>

      <div class="card-label">HOOK</div>
      <div class="card-hook" id="c-hook"></div>

      <div class="card-divider"></div>
      <div class="card-label">CUERPO</div>
      <div class="card-cuerpo" id="c-cuerpo"></div>

      <div class="checklist">
        <label class="check-item"><div class="check-box" id="chk0"></div><span class="check-label">Hook engancha en los primeros 2 segundos</span></label>
        <label class="check-item"><div class="check-box" id="chk1"></div><span class="check-label">Habla de Tandil o de algo que le importa a la audiencia</span></label>
        <label class="check-item"><div class="check-box" id="chk2"></div><span class="check-label">No depende de datos crudos para funcionar</span></label>
        <label class="check-item"><div class="check-box" id="chk3"></div><span class="check-label">Da valor (no es puramente venta)</span></label>
      </div>
    </div>
  </div>

  <div class="btn-row" id="btn-row" style="display:none;">
    <button class="btn-action btn-no" onclick="decide(false)" title="No queda (←)">✕</button>
    <button class="btn-action btn-skip" onclick="skip()" title="Saltar (↓)">⟳</button>
    <button class="btn-action btn-yes" onclick="decide(true)" title="Queda (→)">♥</button>
  </div>

  <div class="key-hint" id="key-hint" style="display:none;">
    <span class="key"><kbd>←</kbd> No queda</span>
    <span class="key"><kbd>→</kbd> Queda</span>
    <span class="key"><kbd>↓</kbd> Saltar</span>
  </div>
</div>

<div class="done" id="done-screen">
  <div class="done-title">Revisión completa</div>
  <div class="done-stats">
    <div class="done-stat yes"><div class="done-stat-num" id="count-yes">0</div><div class="done-stat-lbl">Quedan</div></div>
    <div class="done-stat no"><div class="done-stat-num" id="count-no">0</div><div class="done-stat-lbl">No quedan</div></div>
    <div class="done-stat"><div class="done-stat-num" id="count-skip">0</div><div class="done-stat-lbl">Saltados</div></div>
  </div>
  <button class="btn-restart" onclick="restart()">Revisar de nuevo</button>
</div>

<script>
const SUPABASE_URL = 'https://pgnmpxqljxrpnvexcygh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HmiBL9VpEhaYyPqjA1v67w_F38x48El';

const ANG_COLORS = {
  educativo:  {bg:'#EEF4FF',tx:'#4A7FD9'},
  motivacion: {bg:'#FDF8E8',tx:'#8B6F3A'},
  tandil:     {bg:'#F0FAF4',tx:'#2D8C5A'},
  mercado:    {bg:'#FEF3E8',tx:'#E07B39'},
  lifestyle:  {bg:'#F8F0FE',tx:'#9B59B6'},
};

let sbClient, sbOk=false;
let guiones=[], idx=0, checks=[false,false,false,false];
let countYes=0, countNo=0, countSkip=0;

try{
  sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sbOk = true;
  document.getElementById('sb-dot').className='dot ok';
}catch(e){}

async function loadGuiones(){
  if(!sbOk){ showLoader(false); return; }
  let all=[], from=0, ps=1000;
  while(true){
    const {data,error} = await sbClient.from('guiones').select('id,titulo,angulo,hook,texto,status').range(from,from+ps-1);
    if(error||!data?.length) break;
    all.push(...data);
    if(data.length<ps) break;
    from+=ps;
  }
  // Mostrar todos — el usuario decide cuáles quedan
  guiones = all;
  // Shuffle for fresh feel
  for(let i=guiones.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[guiones[i],guiones[j]]=[guiones[j],guiones[i]];}
  showLoader(false);
  if(guiones.length===0){document.getElementById('loader').innerHTML='<span>No hay guiones pendientes de revisión.</span>';document.getElementById('loader').style.display='flex';return;}
  showCard();
}

function showLoader(v){
  document.getElementById('loader').style.display=v?'flex':'none';
}

function showCard(){
  if(idx>=guiones.length){endSession();return;}
  const g=guiones[idx];
  const ang=(g.angulo||'').toLowerCase();
  const colors=ANG_COLORS[ang]||{bg:'#F5F5F3',tx:'#777'};
  const angEl=document.getElementById('c-ang');
  angEl.textContent=(g.angulo||'Sin ángulo').toUpperCase();
  angEl.style.background=colors.bg; angEl.style.color=colors.tx;
  document.getElementById('c-titulo').textContent=g.titulo||'Sin título';
  document.getElementById('c-hook').textContent=g.hook||'—';
  document.getElementById('c-cuerpo').textContent=g.texto||'—';
  checks=[false,false,false,false];
  renderChecks();
  const card=document.getElementById('main-card');
  card.classList.remove('fly-left','fly-right');
  document.getElementById('card-wrap').style.display='block';
  document.getElementById('btn-row').style.display='flex';
  document.getElementById('key-hint').style.display='flex';
  document.getElementById('verd-yes').style.opacity=0;
  document.getElementById('verd-no').style.opacity=0;
  updateProgress();
}

function renderChecks(){
  for(let i=0;i<4;i++){
    const el=document.getElementById('chk'+i);
    el.className='check-box'+(checks[i]?' checked':'');
  }
}

// Attach check clicks
document.querySelectorAll('.check-item').forEach((el,i)=>{
  el.addEventListener('click',()=>{
    checks[i]=!checks[i];
    renderChecks();
  });
});

function updateProgress(){
  const total=guiones.length, done=idx;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-txt').textContent=`${done}/${total}`;
}

async function decide(queda){
  const g=guiones[idx];
  const card=document.getElementById('main-card');
  const verd=document.getElementById(queda?'verd-yes':'verd-no');
  verd.style.opacity=1;
  card.classList.add(queda?'fly-right':'fly-left');
  if(queda) countYes++; else countNo++;
  // Save to Supabase
  if(sbOk && sbClient){
    try{
      await sbClient.from('sala_votos').upsert(
        {guion_id:String(g.id), voter:'tinder', voto:queda, updated_at:new Date().toISOString()},
        {onConflict:'guion_id,voter'}
      );
    }catch(e){}
  }
  setTimeout(()=>{idx++;showCard();},280);
}

function skip(){
  countSkip++;
  const card=document.getElementById('main-card');
  card.style.opacity=0;
  setTimeout(()=>{idx++;showCard();card.style.opacity=1;},200);
}

function endSession(){
  document.getElementById('card-wrap').style.display='none';
  document.getElementById('btn-row').style.display='none';
  document.getElementById('key-hint').style.display='none';
  document.getElementById('count-yes').textContent=countYes;
  document.getElementById('count-no').textContent=countNo;
  document.getElementById('count-skip').textContent=countSkip;
  const done=document.getElementById('done-screen');
  done.style.display='flex'; done.className='done show';
}

function restart(){
  idx=0; countYes=0; countNo=0; countSkip=0;
  // Reshuffle
  for(let i=guiones.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[guiones[i],guiones[j]]=[guiones[j],guiones[i]];}
  document.getElementById('done-screen').className='done';
  document.getElementById('done-screen').style.display='none';
  showCard();
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') decide(true);
  else if(e.key==='ArrowLeft') decide(false);
  else if(e.key==='ArrowDown') skip();
});

loadGuiones();
</script>
</body>
</html>
