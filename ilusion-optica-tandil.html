<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilusión Óptica — Tandil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ivory: #fdf3dd;
      --green: #6d6e5e;
      --taupe: #8b796d;
      --black: #323232;
      --t: 180ms ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Onest', sans-serif; background: #f7f4ef; color: var(--black); -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--green);
      box-shadow: 0 2px 12px rgba(50,50,50,0.15);
    }
    .nav-in {
      max-width: 1280px; margin: 0 auto; padding: 0 24px;
      height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .nav-logo {
      display: flex; flex-direction: column;
      font-family: 'Outfit', sans-serif; font-weight: 900;
      font-size: 1.35rem; letter-spacing: -0.02em; line-height: 1;
      color: var(--ivory);
    }
    .nav-logo-word { display: flex; align-items: center; }
    .nav-eye { display: inline-flex; align-items: center; width: 1.1em; height: 1.1em; margin: 0 1px; }
    .nav-eye svg { width: 100%; height: 100%; }
    .nav-logo-sub { font-size: 0.45rem; letter-spacing: 0.5em; opacity: 0.65; font-weight: 600; text-transform: uppercase; margin-top: 2px; padding-left: 0.1em; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-search {
      display: flex; align-items: center; gap: 8px;
      background: rgba(253,243,221,0.12); border: 1px solid rgba(253,243,221,0.2);
      border-radius: 8px; padding: 7px 12px;
    }
    .nav-search input {
      background: transparent; border: none; outline: none;
      color: var(--ivory); font-family: 'Onest', sans-serif; font-size: 0.875rem;
      width: 180px;
    }
    .nav-search input::placeholder { color: rgba(253,243,221,0.45); }
    .nav-search svg { color: rgba(253,243,221,0.5); flex-shrink: 0; }
    .cart-btn {
      position: relative; display: flex; align-items: center; gap: 8px;
      background: var(--ivory); color: var(--green);
      border: none; border-radius: 8px; padding: 8px 16px;
      font-family: 'Onest', sans-serif; font-size: 0.875rem; font-weight: 700;
      cursor: pointer; transition: background var(--t), transform 100ms ease;
    }
    .cart-btn:hover { background: #f5e8c4; transform: translateY(-1px); }
    .cart-badge {
      position: absolute; top: -6px; right: -6px;
      background: #e04e3a; color: white; border-radius: 50%;
      width: 18px; height: 18px; font-size: 0.65rem; font-weight: 800;
      display: none; align-items: center; justify-content: center;
    }
    .cart-badge.show { display: flex; }
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; padding: 6px; border: none; background: transparent;
    }
    .hamburger span { display: block; width: 20px; height: 2px; background: var(--ivory); border-radius: 2px; }

    /* HERO MINI */
    .hero-mini {
      background: var(--green); padding: 20px 24px 28px;
      text-align: center; border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .hero-mini h1 {
      font-family: 'Onest', sans-serif; font-size: 1rem; font-weight: 400;
      color: rgba(253,243,221,0.7); letter-spacing: 0.06em;
    }

    /* FILTERS */
    .filters {
      background: white; border-bottom: 1px solid #e8e4dd;
      position: sticky; top: 64px; z-index: 90;
    }
    .filters-in {
      max-width: 1280px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; gap: 8px;
      overflow-x: auto; height: 52px;
      scrollbar-width: none;
    }
    .filters-in::-webkit-scrollbar { display: none; }
    .filter-btn {
      flex-shrink: 0; padding: 6px 16px; border-radius: 100px;
      border: 1.5px solid #d8d4cc; background: transparent;
      font-family: 'Onest', sans-serif; font-size: 0.8rem; font-weight: 600;
      color: var(--taupe); cursor: pointer;
      transition: all var(--t); white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--green); color: var(--green); }
    .filter-btn.active { background: var(--green); border-color: var(--green); color: var(--ivory); }
    .filter-sep { width: 1px; height: 24px; background: #e0dbd4; flex-shrink: 0; margin: 0 4px; }

    /* MAIN */
    .main { max-width: 1280px; margin: 0 auto; padding: 24px 24px 80px; }
    .results-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #e8e4dd;
    }
    .results-count { font-size: 0.85rem; color: var(--taupe); font-weight: 500; }
    .sort-sel {
      font-family: 'Onest', sans-serif; font-size: 0.8rem; color: var(--green);
      border: 1.5px solid #d8d4cc; border-radius: 6px; padding: 5px 10px;
      background: white; cursor: pointer; outline: none;
    }

    /* PRODUCT GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .card {
      background: white; border-radius: 12px; overflow: hidden;
      border: 1px solid #e8e4dd;
      transition: transform var(--t), box-shadow var(--t);
      display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(50,50,50,0.1); }
    .card-img {
      aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .card-img.brand-rayban { background: linear-gradient(135deg, #2c2c2c, #4a4a4a); }
    .card-img.brand-ocli { background: linear-gradient(135deg, var(--green), #5a5b4d); }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-img-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px;
    }
    .card-img-placeholder svg { opacity: 0.3; }
    .card-img-placeholder span {
      font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 800;
      color: rgba(255,255,255,0.5); letter-spacing: 0.05em; text-align: center;
    }
    .card-marca-badge {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px; padding: 3px 8px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: white;
    }
    .card-stock-badge {
      position: absolute; top: 10px; right: 10px;
      background: rgba(224,78,58,0.9);
      border-radius: 6px; padding: 3px 8px;
      font-size: 0.65rem; font-weight: 700; color: white;
    }
    .card-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .card-name { font-size: 0.9rem; font-weight: 600; color: var(--black); line-height: 1.3; }
    .card-desc { font-size: 0.75rem; color: var(--taupe); line-height: 1.55; flex: 1; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .card-price {
      font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--green);
    }
    .card-price span { font-size: 0.7rem; font-weight: 500; color: var(--taupe); margin-right: 2px; }
    .add-btn {
      display: flex; align-items: center; gap: 5px;
      background: var(--green); color: var(--ivory); border: none;
      border-radius: 7px; padding: 7px 12px;
      font-family: 'Onest', sans-serif; font-size: 0.78rem; font-weight: 700;
      cursor: pointer; transition: background var(--t), transform 100ms ease;
    }
    .add-btn:hover { background: #5a5b4d; }
    .add-btn:active { transform: scale(0.96); }
    .add-btn.added { background: #2d7a47; }

    /* EMPTY STATE */
    .empty {
      grid-column: 1 / -1; text-align: center; padding: 64px 24px;
      color: var(--taupe);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
    .empty h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
    .empty p { font-size: 0.875rem; }

    /* SKELETON */
    .skeleton { background: #e8e4dd; border-radius: 12px; overflow: hidden; }
    .sk-img { aspect-ratio: 4/3; background: linear-gradient(90deg, #e8e4dd 25%, #f0ece4 50%, #e8e4dd 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    .sk-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
    .sk-line { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #e8e4dd 25%, #f0ece4 50%, #e8e4dd 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    .sk-line.short { width: 60%; }
    .sk-line.price { width: 40%; height: 16px; margin-top: 4px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* CART OVERLAY */
    .cart-overlay {
      position: fixed; inset: 0; background: rgba(50,50,50,0.45);
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity var(--t);
    }
    .cart-overlay.open { opacity: 1; pointer-events: all; }
    .cart-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw);
      background: white; z-index: 201; display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform 280ms ease;
      box-shadow: -4px 0 32px rgba(50,50,50,0.15);
    }
    .cart-overlay.open .cart-panel { transform: translateX(0); }
    .cart-header {
      padding: 20px 24px 16px; border-bottom: 1px solid #e8e4dd;
      display: flex; align-items: center; justify-content: space-between;
    }
    .cart-title { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 800; color: var(--black); }
    .cart-close {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: #f0ece4; cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--black); transition: background var(--t);
    }
    .cart-close:hover { background: #e0dbd4; }
    .cart-items { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; }
    .cart-empty { text-align: center; padding: 48px 0; color: var(--taupe); }
    .cart-empty svg { margin: 0 auto 12px; display: block; opacity: 0.3; }
    .cart-empty p { font-size: 0.875rem; }
    .cart-item {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px; border-radius: 10px; background: #f7f4ef;
    }
    .ci-img {
      width: 60px; height: 50px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .ci-img.brand-rayban { background: linear-gradient(135deg, #2c2c2c, #4a4a4a); }
    .ci-img.brand-ocli { background: linear-gradient(135deg, var(--green), #5a5b4d); }
    .ci-info { flex: 1; min-width: 0; }
    .ci-name { font-size: 0.82rem; font-weight: 600; color: var(--black); line-height: 1.3; margin-bottom: 2px; }
    .ci-brand { font-size: 0.7rem; color: var(--taupe); margin-bottom: 8px; }
    .ci-controls { display: flex; align-items: center; gap: 0; }
    .qty-btn {
      width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid #d8d4cc;
      background: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: var(--black); font-weight: 700;
      transition: border-color var(--t), background var(--t);
    }
    .qty-btn:hover { border-color: var(--green); background: #f0f4ee; }
    .qty-num { width: 32px; text-align: center; font-weight: 700; font-size: 0.9rem; color: var(--black); }
    .ci-price { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 0.9rem; color: var(--green); margin-top: 6px; }
    .ci-remove { background: none; border: none; cursor: pointer; color: #ccc; padding: 4px; transition: color var(--t); }
    .ci-remove:hover { color: #e04e3a; }
    .cart-footer { padding: 16px 24px 24px; border-top: 1px solid #e8e4dd; display: flex; flex-direction: column; gap: 12px; }
    .cart-subtotal { display: flex; justify-content: space-between; align-items: center; }
    .cart-subtotal-label { font-size: 0.875rem; color: var(--taupe); font-weight: 500; }
    .cart-total-val { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 900; color: var(--black); }
    .checkout-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 15px; border-radius: 10px; border: none;
      background: #25D366; color: white;
      font-family: 'Onest', sans-serif; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background var(--t), transform 100ms ease;
    }
    .checkout-btn:hover { background: #1fb55a; transform: translateY(-1px); }
    .checkout-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .cart-note { font-size: 0.72rem; color: var(--taupe); text-align: center; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--black); color: white;
      padding: 12px 20px; border-radius: 8px; font-size: 0.875rem; font-weight: 500;
      z-index: 300; transition: transform 280ms ease;
      white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* FOOTER */
    footer { background: var(--black); padding: 28px 24px; text-align: center; }
    footer p { font-size: 0.75rem; color: rgba(253,243,221,0.35); }

    /* RESPONSIVE */
    @media(max-width:1100px){ .grid { grid-template-columns: repeat(3, 1fr); } }
    @media(max-width:768px){
      .grid { grid-template-columns: repeat(2, 1fr); }
      .nav-search { display: none; }
      .hero-mini { padding: 14px 24px 20px; }
    }
    @media(max-width:480px){
      .grid { grid-template-columns: 1fr; }
      .cart-panel { width: 100vw; }
    }

    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-in">
    <a class="nav-logo" href="#">
      <div class="nav-logo-word">
        ILUSI
        <span class="nav-eye">
          <svg viewBox="0 0 44 44" fill="none"><circle cx="22" cy="22" r="16" stroke="#fdf3dd" stroke-width="4.5"/><circle cx="22" cy="22" r="5.5" fill="#fdf3dd"/></svg>
        </span>
        N
      </div>
      <div class="nav-logo-sub">Ó p t i c a · T a n d i l</div>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Buscar producto...">
      </div>
      <button class="cart-btn" id="cart-btn" onclick="openCart()">

      </button>
    </div>

</nav>

<!-- HERO MINI -->
<div class="hero-mini">
  <h1>Lentes de sol · Colección 2025</h1>
</div>

<!-- FILTERS -->
<div class="filters">
  <div class="filters-in">
    <button class="filter-btn active" data-filter="all">Todo</button>
    <div class="filter-sep"></div>
    <button class="filter-btn" data-filter="marca-Ray-Ban">Ray-Ban</button>
    <button class="filter-btn" data-filter="marca-Ocli">Ocli</button>
    <div class="filter-sep"></div>
    <button class="filter-btn" data-filter="precio-bajo">Menor precio</button>
    <button class="filter-btn" data-filter="precio-alto">Mayor precio</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="results-bar">
    <span class="results-count" id="results-count">Cargando...</span>
    <select class="sort-sel" id="sort-sel" onchange="applySort()">
      <option value="default">Ordenar por</option>
      <option value="precio-asc">Precio: menor a mayor</option>
      <option value="precio-desc">Precio: mayor a menor</option>
      <option value="nombre-asc">Nombre A–Z</option>

    <div class="skeleton"><div class="sk-img"></div><div class="sk-body"><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-line price"></div></div></div>

    <div class="skeleton"><div class="sk-img"></div><div class="sk-body"><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-line price"></div></div></div>
    <div class="skeleton"><div class="sk-img"></div><div class="sk-body"><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-line price"></div></div></div>

</div>

<!-- CART OVERLAY + PANEL -->

  <div class="cart-panel" id="cart-panel">
    <div class="cart-header">
      <div class="cart-title">Tu carrito</div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<footer>

</footer>

<script>
  const SUPA_URL = 'https://pgnmpxqljxrpnvexcygh.supabase.co';
  const SUPA_KEY = 'sb_publishable_HmiBL9VpEhaYyPqjA1v67w_F38x48El';
  // ↓ ACTUALIZAR con número real de WhatsApp
  const WA_NUMBER = '5492490000000';

  const { createClient } = supabase;
  const db = createClient(SUPA_URL, SUPA_KEY);

  let allProducts = [];
  let filtered = [];
  let cart = JSON.parse(localStorage.getItem('ilusion_cart') || '[]');
  let currentFilter = 'all';
  let currentSort = 'default';
  let searchTerm = '';

  // ── LOAD PRODUCTS ──
  async function loadProducts() {
    const { data, error } = await db
      .from('ilusion_productos')
      .select('*')
      .eq('activo', true)
      .order('marca', { ascending: true })
      .order('nombre', { ascending: true });

    if (error) { console.error(error); return; }
    allProducts = data;
    applyFilters();
  }

  // ── FILTER + SORT ──
  function applyFilters() {
    let result = [...allProducts];

    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      result = result.filter(p => p.nombre.toLowerCase().includes(q) || p.marca.toLowerCase().includes(q));
    }

    if (currentFilter !== 'all') {
      if (currentFilter.startsWith('marca-')) {
        const m = currentFilter.replace('marca-', '');
        result = result.filter(p => p.marca === m);
      } else if (currentFilter === 'precio-bajo') {
        result = [...result].sort((a, b) => a.precio - b.precio);
      } else if (currentFilter === 'precio-alto') {
        result = [...result].sort((a, b) => b.precio - a.precio);
      }
    }

    if (currentSort === 'precio-asc') result.sort((a,b) => a.precio - b.precio);
    else if (currentSort === 'precio-desc') result.sort((a,b) => b.precio - a.precio);
    else if (currentSort === 'nombre-asc') result.sort((a,b) => a.nombre.localeCompare(b.nombre));

    filtered = result;
    renderGrid();
  }

  function applySort() {
    currentSort = document.getElementById('sort-sel').value;
    applyFilters();
  }

  // ── RENDER GRID ──
  function renderGrid() {
    const grid = document.getElementById('grid');
    const count = document.getElementById('results-count');
    count.textContent = `${filtered.length} producto${filtered.length !== 1 ? 's' : ''}`;

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><h3>Sin resultados</h3><p>Intentá con otro filtro o búsqueda</p></div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => {
      const brandClass = p.marca === 'Ray-Ban' ? 'brand-rayban' : 'brand-ocli';
      const inCart = cart.find(c => c.id === p.id);
      const lowStock = p.stock > 0 && p.stock <= 3;
      const noStock = p.stock === 0;

      return `
      <div class="card">
        <div class="card-img ${brandClass}">
          ${p.imagen_url
            ? `<img src="${p.imagen_url}" alt="${p.nombre}" loading="lazy">`
            : `<div class="card-img-placeholder">
                <svg width="40" height="26" viewBox="0 0 200 110" fill="none">
                  <rect x="4" y="22" width="80" height="58" rx="22" stroke="rgba(255,255,255,0.4)" stroke-width="5" fill="rgba(255,255,255,0.06)"/>
                  <path d="M84 51 L116 51" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round"/>
                  <rect x="116" y="22" width="80" height="58" rx="22" stroke="rgba(255,255,255,0.4)" stroke-width="5" fill="rgba(255,255,255,0.06)"/>
                </svg>
                <span>${p.marca}</span>
               </div>`
          }
          <div class="card-marca-badge">${p.marca}</div>
          ${lowStock ? `<div class="card-stock-badge">¡Últimas ${p.stock}!</div>` : ''}
          ${noStock ? `<div class="card-stock-badge">Sin stock</div>` : ''}
        </div>
        <div class="card-body">
          <div class="card-name">${p.nombre}</div>
          <div class="card-desc">${p.descripcion || ''}</div>
          <div class="card-footer">
            <div class="card-price"><span>$</span>${Number(p.precio).toLocaleString('es-AR')}</div>
            <button class="add-btn ${inCart ? 'added' : ''}" onclick="addToCart('${p.id}')" ${noStock ? 'disabled' : ''}>
              ${inCart
                ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> En carrito`
                : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Agregar`
              }
            </button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  // ── FILTER BUTTONS ──
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      applyFilters();
    });
  });

  // ── SEARCH ──
  document.getElementById('search-input').addEventListener('input', e => {
    searchTerm = e.target.value.trim();
    applyFilters();
  });

  // ── CART ──
  function addToCart(id) {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;
    const existing = cart.find(c => c.id === id);
    if (existing) {
      existing.qty = Math.min(existing.qty + 1, product.stock);
    } else {
      cart.push({ id: product.id, nombre: product.nombre, marca: product.marca, precio: product.precio, qty: 1, stock: product.stock });
    }
    saveCart();
    renderGrid();
    updateCartBadge();
    showToast(`"${product.nombre.split(' ').slice(0,3).join(' ')}" agregado al carrito`);
    if (!document.getElementById('cart-overlay').classList.contains('open')) {
      setTimeout(openCart, 300);
    }
  }

  function removeFromCart(id) {
    cart = cart.filter(c => c.id !== id);
    saveCart();
    renderCartPanel();
    updateCartBadge();
    renderGrid();
  }

  function changeQty(id, delta) {
    const item = cart.find(c => c.id === id);
    if (!item) return;
    item.qty = Math.max(1, Math.min(item.qty + delta, item.stock));
    saveCart();
    renderCartPanel();
  }

  function saveCart() {
    localStorage.setItem('ilusion_cart', JSON.stringify(cart));
  }

  function updateCartBadge() {
    const total = cart.reduce((s, c) => s + c.qty, 0);
    const badge = document.getElementById('cart-badge');
    badge.textContent = total;
    badge.classList.toggle('show', total > 0);
  }

  function renderCartPanel() {
    const container = document.getElementById('cart-items');
    const totalEl = document.getElementById('cart-total');
    const checkoutBtn = document.getElementById('checkout-btn');

    if (cart.length === 0) {
      container.innerHTML = `<div class="cart-empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <p>Tu carrito está vacío.<br>¡Agregá algún producto!</p>
      </div>`;
      totalEl.textContent = '$0';
      checkoutBtn.disabled = true;
      return;
    }

    const total = cart.reduce((s, c) => s + c.precio * c.qty, 0);
    totalEl.textContent = '$' + total.toLocaleString('es-AR');
    checkoutBtn.disabled = false;

    container.innerHTML = cart.map(item => {
      const brandClass = item.marca === 'Ray-Ban' ? 'brand-rayban' : 'brand-ocli';
      return `
      <div class="cart-item">
        <div class="ci-img ${brandClass}">
          <svg width="32" height="20" viewBox="0 0 200 110" fill="none">
            <rect x="4" y="22" width="80" height="58" rx="22" stroke="rgba(255,255,255,0.4)" stroke-width="5" fill="rgba(255,255,255,0.06)"/>
            <path d="M84 51 L116 51" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round"/>
            <rect x="116" y="22" width="80" height="58" rx="22" stroke="rgba(255,255,255,0.4)" stroke-width="5" fill="rgba(255,255,255,0.06)"/>
          </svg>
        </div>
        <div class="ci-info">
          <div class="ci-name">${item.nombre}</div>
          <div class="ci-brand">${item.marca}</div>
          <div class="ci-controls">
            <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
          </div>
          <div class="ci-price">$${(item.precio * item.qty).toLocaleString('es-AR')}</div>
        </div>
        <button class="ci-remove" onclick="removeFromCart('${item.id}')" title="Eliminar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>`;
    }).join('');
  }

  function openCart() {
    renderCartPanel();
    document.getElementById('cart-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeCart() {
    document.getElementById('cart-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('cart-overlay')) closeCart();
  }

  // ── CHECKOUT VIA WHATSAPP ──
  function checkout() {
    if (cart.length === 0) return;
    const total = cart.reduce((s, c) => s + c.precio * c.qty, 0);
    let msg = '¡Hola! Quiero hacer un pedido de Ilusión Óptica:\n\n';
    cart.forEach(item => {
      msg += `• ${item.nombre} (${item.marca}) x${item.qty} — $${(item.precio * item.qty).toLocaleString('es-AR')}\n`;
    });
    msg += `\n*Total: $${total.toLocaleString('es-AR')}*\n\n¿Están disponibles?`;
    window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  // ── TOAST ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── INIT ──
  updateCartBadge();
  loadProducts();
</script>
</body>
</html>
